<!DOCTYPE html><!-- todos os documentos HTML devem começar com uma declaração-->
<html lang="pt-br"> <!-- atributo especifica o idioma do conteúdo do elemento.-->
<head><!-- serve como um contêiner para meta dados (dados sobre dados)-->
	<meta charset="UTF-8"> <!-- atributo especifica a codificação de caracteres para o documento HTML.-->
	<title>Exemplo</title> <!-- titulo -->
</head>
<body>
	<header> <!--para criação de cabeçalho-->
	<h1>Título da Página</h1>
	<nav> <!--serve para criar menus, sumários ou listas de links-->
		<p>Home</p><!-- parágrafo-->
	</nav>
	</header>
	<main> <!-- define o conteúdo principal do documento-->
	<article> <!-- indica que o bloco ou mídia faz sentido por si só mesmo se for retirado do resto da página ou levado para outro site como um post de blog, uma noticia ou um comentario -->
		<h2>Artigo 1</h2>
		<p>Este artigo é sobre...</p> <!--paragráfo-->
	</article>
	<article>
		<h2>Artigo 2</h2>
		<p>Este artigo é sobre...</p>
	</article>
	</main>
	<footer> <!-- Define um rodapé para um documento ou seção-->
		<p>&copy; 2024 Exemplo</p>
	</footer>
</body>
	
</html>
