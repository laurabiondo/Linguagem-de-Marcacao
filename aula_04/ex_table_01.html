<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Tabela de serviços Mecânicos</title>
	</head>
	<body>
		<table border="1" width="100%">
		<thead>
			<tr>
				<th colspan="5"; style="background-color:#88e788">Tabela de Serviços Mecânicos</th>
			</tr>
		</thead>
		<tbody>
			<tr>
					<!-- th -> table head-->
					<th rowspan="5"; style="background-color:green">Nacionais</th>
					<th style="background-color:#d3d3d3; color:#000000">Veiculos</th>
					<th style="background-color:#d3d3d3; color:#000000">Serviço</th>
					<th style="background-color:#d3d3d3; color:#000000">Tempo Previsto</th>
					<th style="background-color:#d3d3d3; color:#000000">Valor</th>
			</tr>
			<tr>
				<th>Caminhonete</th>
				<th>Suspensão</th>
				<th>3 horas e 25 minutos</th>
				<th>350,00</th>
			</tr>
			<tr>
				<th>Caminhonete ranger</th>
				<th>Freio</th>
				<th>3 horas e 45 minutos</th>
				<th>200,00</th>
			</tr>
			<tr>
				<th>Caminhonete Hilux</th>
				<th>Troca de bateria</th>
				<th>30 minutos</th>
				<th>25,00</th>
			</tr>
			<tr>
				<th>Caminhonete D10</th>
				<th>Alinhamento</th>
				<th>1 hora e 40 minutos</th>
				<th>25,00</th>
			</tr>
		</tbody>
	</body>
</html>
